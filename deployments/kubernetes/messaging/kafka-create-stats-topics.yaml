apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-create-stats-topics
  namespace: payment-gateway
spec:
  # Clean up the finished Job automatically so repeat applies don't pile up.
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: kafka-topic-init
          image: apache/kafka:4.3.1
          command:
            - /bin/sh
            - -c
            - |
              BOOTSTRAP="kafka.payment-gateway.svc.cluster.local:9092"

              echo "Waiting for Kafka broker at $BOOTSTRAP ..."
              until kafka-topics.sh --bootstrap-server "$BOOTSTRAP" --list >/dev/null 2>&1; do
                echo "Kafka not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Kafka is ready."

              echo "Creating payment stats Kafka topics..."
              for topic in \
                stats.payment.transaction.event \
                stats.payment.topup.event \
                stats.payment.transfer.event \
                stats.payment.withdraw.event \
                stats.payment.saldo.event \
                stats.payment.merchant.event \
                stats.payment.card.event; do
                kafka-topics.sh \
                  --bootstrap-server "$BOOTSTRAP" \
                  --create \
                  --if-not-exists \
                  --replication-factor 1 \
                  --partitions 1 \
                  --topic "$topic"
              done
              echo "All payment stats topics created (or already exist)."
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
